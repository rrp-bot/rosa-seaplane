global:
  # Supplied by the ArgoCD cluster identity annotation; registry is ECR us-east-1.
  image_registry_account_id: ""

seaplane:
  applicationName: seaplane-operator

  namespace: argocd

  targetNamespace: seaplane

  project: default

  source:
    repoURL: https://github.com/openshift-online/rosa-seaplane-api.git
    targetRevision: f59b0034c13cf39d506e2ead73ebd0b5cd42cd1e
    path: seaplane-operator/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      repository: rosa-seaplane-operator
      # Preserve the original source path for deployments where the registry
      # account annotation is intentionally absent.
      quayRepository: redhat-user-workloads/rosa-tenant/rosa-seaplane-operator
      tag: "e6cb96b90c0618d0760c8e8f5ba3bfc248082952@sha256:ecbc10e6618c4bc40ee0b641f99c7cab34977f272dd1ce246e7f96620034fb00"
      pullPolicy: Always

    replicaCount: 2

    serviceAccount:
      create: true
      name: seaplane-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
