{{- $imageValues := index (index .Values "seaplane" "helmValues") "image" -}}
{{- $repository := index $imageValues "repository" -}}
{{- if contains "/" $repository -}}
  {{- /* A fully-qualified CI override (e.g. quay.io/rrp-dev-ci/...) wins over ECR templating. */ -}}
{{- else if .Values.global.image_registry_account_id -}}
{{- $repository = printf "%s.dkr.ecr.us-east-1.amazonaws.com/%s" .Values.global.image_registry_account_id $repository -}}
{{- else -}}
{{- $repository = printf "quay.io/%s" (index $imageValues "quayRepository") -}}
{{- end -}}
{{- $helmValues := deepCopy (index .Values "seaplane" "helmValues") -}}
{{- $copiedImageValues := index $helmValues "image" -}}
{{- $_ := unset $copiedImageValues "quayRepository" -}}
{{- $_ := set $copiedImageValues "repository" $repository -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ index .Values "seaplane" "applicationName" }}
  namespace: {{ index .Values "seaplane" "namespace" }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ index .Values "seaplane" "project" }}

  source:
    repoURL: {{ index .Values "seaplane" "source" "repoURL" }}
    targetRevision: {{ index .Values "seaplane" "source" "targetRevision" }}
    path: {{ index .Values "seaplane" "source" "path" }}
    helm:
      values: |
        {{- if index .Values "seaplane" "helmValues" }}
        {{- toYaml $helmValues | nindent 8 }}
        {{- end }}
        awsRegion: {{ .Values.global.aws_region }}
        baseDomain: {{ .Values.baseDomain }}
        oidcS3Bucket: {{ index .Values "seaplane" "oidcS3Bucket" }}
        oidcIssuerBaseUrl: {{ index .Values "seaplane" "oidcIssuerBaseUrl" }}
        alertmanager:
          url: http://monitoring-alertmanager.monitoring.svc:9093
        postgres:
          secretName: {{ .Values.global.postgres_secret_name | default "seaplane-db-dsn" }}
          secretKey: {{ .Values.global.postgres_secret_key | default "dsn" }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "seaplane" "targetNamespace" }}

  syncPolicy:
    {{- if index .Values "seaplane" "syncPolicy" "automated" }}
    automated:
      prune: {{ index .Values "seaplane" "syncPolicy" "automated" "prune" }}
      selfHeal: {{ index .Values "seaplane" "syncPolicy" "automated" "selfHeal" }}
    {{- end }}
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
